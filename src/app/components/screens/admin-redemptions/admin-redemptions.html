<mat-toolbar color="primary" style="gap: 8px">
  <button mat-icon-button (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <span>Το Προφίλ μου</span>
</mat-toolbar>
<div class="page">
  <div class="header">
    <div>
      <h1>Pending Redemptions</h1>
      <p class="subtitle">Διαχείριση αιτημάτων εξαργύρωσης.</p>
    </div>

    <button mat-stroked-button (click)="load()">
      <mat-icon>refresh</mat-icon>
      Ανανέωση
    </button>
  </div>

  <mat-divider></mat-divider>

  <div class="center" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div class="empty" *ngIf="!loading && items.length === 0">
    <mat-icon class="empty-icon">assignment</mat-icon>
    <h2>Δεν υπάρχουν pending αιτήματα</h2>
  </div>

  <div class="list" *ngIf="!loading && items.length > 0">
    <mat-card class="item" *ngFor="let x of items">
      <mat-card-header>
        <mat-card-title>Redemption #{{ x.id }}</mat-card-title>
        <mat-card-subtitle>
          Χρήστης: {{ x.userName }} • Reward: {{ x.rewardTitle }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="row">
          <span>Status:</span>
          <mat-chip class="chip" [ngClass]="statusText(x.status)">{{
            statusText(x.status)
          }}</mat-chip>
        </div>

        <div class="row" *ngIf="x.costSnapshot != null">
          <span>Cost:</span>
          <b>{{ x.costSnapshot }}</b>
        </div>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Fulfill Code</mat-label>
          <input matInput [(ngModel)]="codes[x.id]" />
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions class="actions">
        <button
          mat-stroked-button
          color="primary"
          (click)="approve(x.id)"
          [disabled]="isBusy(x.id)"
        >
          <mat-icon>check</mat-icon>
          Approve
        </button>

        <button mat-stroked-button color="warn" (click)="reject(x.id)" [disabled]="isBusy(x.id)">
          <mat-icon>close</mat-icon>
          Reject
        </button>

        <button
          mat-raised-button
          color="primary"
          (click)="fulfill(x.id)"
          [disabled]="isBusy(x.id) || x.status !== 'Approved'"
        >
          <mat-icon>local_shipping</mat-icon>
          Fulfill
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
