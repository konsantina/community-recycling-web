<div style="display:flex; justify-content:center; margin-top:40px;">
  <mat-card style="width:520px;">
    <mat-card-title>Νέα Καταχώρηση Ανακύκλωσης</mat-card-title>

    <form [formGroup]="form">

      <mat-form-field appearance="outline" style="width:100%; margin-top:16px;">
        <mat-label>Υλικό</mat-label>
        <mat-select formControlName="materialId">
          <mat-option *ngFor="let m of materials" [value]="m.id">
            {{ m.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('materialId')?.invalid">Διάλεξε υλικό</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width:100%;">
        <mat-label>Γειτονιά</mat-label>
        <mat-select formControlName="neighborhoodId">
          <mat-option *ngFor="let n of neighborhoods" [value]="n.id">
            {{ n.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('neighborhoodId')?.invalid">Διάλεξε γειτονιά</mat-error>
      </mat-form-field>

      <div style="display:flex; gap:12px;">
        <mat-form-field appearance="outline" style="width:60%;">
          <mat-label>Ποσότητα</mat-label>
          <input matInput type="number" formControlName="quantity" />
          <mat-error *ngIf="form.get('quantity')?.invalid">Βάλε ποσότητα</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:40%;">
          <mat-label>Μονάδα</mat-label>
          <mat-select formControlName="unit">
            <mat-option *ngFor="let u of units" [value]="u.value">
              {{ u.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" style="width:100%;">
        <mat-label>Τοποθεσία</mat-label>
        <input matInput formControlName="location" placeholder="π.χ. Κάδος δίπλα στο σχολείο" />
        <mat-error *ngIf="form.get('location')?.invalid">Βάλε τοποθεσία</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" style="width:100%; margin-top:12px;" type="submit" [disabled]="loading" (click)="submit()">
        {{ loading ? 'Αποθήκευση...' : 'Καταχώρηση' }}
      </button>

      <p *ngIf="error" style="color:red; margin-top:10px;">
        {{ error }}
      </p>

    </form>
  </mat-card>
</div>
