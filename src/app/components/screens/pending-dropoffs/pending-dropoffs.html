<div style="padding: 16px;">
  <h2>Pending Dropoffs</h2>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <div style="margin-top: 12px; display: flex; gap: 10px;">
    <button mat-stroked-button (click)="load()" [disabled]="loading">Refresh</button>
  </div>

  <div *ngIf="!loading && items.length === 0" style="margin-top: 16px; opacity: 0.75;">
    Δεν υπάρχουν pending dropoffs.
  </div>

  <div style="margin-top: 16px; overflow: auto;">
    <table mat-table [dataSource]="items" class="mat-elevation-z2" style="min-width: 900px; width: 100%;">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let x">{{ x.id }}</td>
      </ng-container>

      <!-- Material -->
      <ng-container matColumnDef="material">
        <th mat-header-cell *matHeaderCellDef>Material</th>
        <td mat-cell *matCellDef="let x">
          <div>{{ x.materialName }}</div>
          <div style="font-size: 12px; opacity: 0.7;">#{{ x.materialId }}</div>
        </td>
      </ng-container>

      <!-- Neighborhood -->
      <ng-container matColumnDef="neighborhood">
        <th mat-header-cell *matHeaderCellDef>Neighborhood</th>
        <td mat-cell *matCellDef="let x">
          <div>{{ x.neighborhoodName || '—' }}</div>
          <div style="font-size: 12px; opacity: 0.7;">#{{ x.neighborhoodId }}</div>
        </td>
      </ng-container>

      <!-- Qty -->
      <ng-container matColumnDef="qty">
        <th mat-header-cell *matHeaderCellDef>Qty</th>
        <td mat-cell *matCellDef="let x">
          {{ x.quantity }} {{ unitLabel(x.unit) }}
        </td>
      </ng-container>

      <!-- Location -->
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let x">{{ x.location }}</td>
      </ng-container>

      <!-- CreatedAt -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let x">{{ x.createdAt }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let x" style="white-space: nowrap;">
          <button
            mat-raised-button
            color="primary"
            (click)="verify(x)"
            [disabled]="busyId === x.id"
            style="margin-right: 8px;"
          >
            {{ busyId === x.id ? '...' : 'Verify' }}
          </button>

          <button
            mat-raised-button
            color="warn"
            (click)="reject(x)"
            [disabled]="busyId === x.id"
          >
            {{ busyId === x.id ? '...' : 'Reject' }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
